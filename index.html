<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maryam Abid — AI Student &amp; Builder</title>
<meta name="description" content="Personal blueprint of Maryam Abid — AI student, UX researcher, and hardware tinkerer based in Lahore, Pakistan." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1B2C;
    --bg-deep:#0A1420;
    --panel:#16243B;
    --panel-2:#1B2C48;
    --line:rgba(237,232,220,0.14);
    --line-strong:rgba(237,232,220,0.28);
    --ink:#EDE8DC;
    --ink-dim:#9FADC2;
    --amber:#E8A33D;
    --blue:#6FA8DC;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --grid-size:42px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
  body{
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/var(--grid-size) var(--grid-size),
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/var(--grid-size) var(--grid-size),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{ color:inherit; }
  ::selection{ background:var(--amber); color:var(--bg-deep); }
  :focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 28px; }
  .crosshair{ position:absolute; width:18px; height:18px; pointer-events:none; }
  .crosshair::before, .crosshair::after{ content:""; position:absolute; background:var(--line-strong); }
  .crosshair::before{ left:50%; top:0; width:1px; height:100%; transform:translateX(-50%); }
  .crosshair::after{ top:50%; left:0; height:1px; width:100%; transform:translateY(-50%); }
  .crosshair.tl{ top:18px; left:18px; }
  .crosshair.tr{ top:18px; right:18px; }
  .crosshair.bl{ bottom:18px; left:18px; }
  .crosshair.br{ bottom:18px; right:18px; }
  header.nav{ position:fixed; top:0; left:0; right:0; z-index:100; background:rgba(15,27,44,0.86); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; height:64px; }
  .nav-mark{ font-family:var(--font-mono); font-size:13px; letter-spacing:0.08em; color:var(--amber); }
  .nav-mark span{ color:var(--ink-dim); }
  nav.nav-links{ display:flex; gap:28px; }
  nav.nav-links a{ font-family:var(--font-mono); font-size:12px; letter-spacing:0.06em; text-decoration:none; color:var(--ink-dim); display:flex; align-items:baseline; gap:6px; transition:color 0.2s ease; }
  nav.nav-links a:hover{ color:var(--amber); }
  nav.nav-links a b{ color:var(--blue); font-weight:500; }
  .nav-toggle{ display:none; font-family:var(--font-mono); background:none; border:1px solid var(--line-strong); color:var(--ink); padding:6px 10px; font-size:12px; cursor:pointer; }
  @media (max-width:760px){
    nav.nav-links{ position:fixed; top:64px; left:0; right:0; background:var(--bg-deep); border-bottom:1px solid var(--line); flex-direction:column; gap:0; max-height:0; overflow:hidden; transition:max-height 0.3s ease; }
    nav.nav-links.open{ max-height:400px; }
    nav.nav-links a{ padding:16px 28px; border-bottom:1px solid var(--line); }
    .nav-toggle{ display:block; }
  }
  .hero{ position:relative; min-height:92vh; display:flex; flex-direction:column; justify-content:center; padding-top:64px; overflow:hidden; }
  .hero-trace{ position:absolute; inset:0; pointer-events:none; opacity:0.9; }
  .hero-trace path{ fill:none; stroke:var(--blue); stroke-width:1.5; stroke-dasharray:1400; stroke-dashoffset:1400; animation:draw 2.6s ease forwards 0.3s; }
  .hero-trace circle{ fill:var(--amber); opacity:0; animation:dotpop 0.4s ease forwards 2.7s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes dotpop{ to{ opacity:1; } }
  .sheet-label{ font-family:var(--font-mono); font-size:12px; letter-spacing:0.14em; color:var(--ink-dim); text-transform:uppercase; margin-bottom:22px; display:flex; align-items:center; gap:12px; }
  .sheet-label::before{ content:""; width:26px; height:1px; background:var(--amber); }
  h1.name{ font-family:var(--font-display); font-weight:700; font-size:clamp(46px, 9vw, 96px); line-height:0.98; letter-spacing:-0.01em; }
  .hero-role{ font-family:var(--font-mono); font-size:clamp(13px,2vw,16px); color:var(--blue); letter-spacing:0.04em; margin-top:20px; max-width:560px; }
  .hero-meta{ display:flex; flex-wrap:wrap; gap:24px; margin-top:30px; font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); }
  .hero-meta span b{ color:var(--ink); font-weight:500; }
  .hero-cta{ display:flex; gap:16px; margin-top:44px; flex-wrap:wrap; }
  .btn{ font-family:var(--font-mono); font-size:13px; letter-spacing:0.04em; padding:13px 24px; text-decoration:none; border:1px solid var(--line-strong); transition:all 0.2s ease; cursor:pointer; background:none; color:var(--ink); }

  .btn.primary:hover{ background:transparent; color:var(--amber); }
  .btn.ghost:hover{ border-color:var(--amber); color:var(--amber); }
  section{ position:relative; padding:110px 0; border-top:1px solid var(--line); }

  .sec-num{ font-family:var(--font-mono); color:var(--amber); font-size:13px; }
  .sec-title{ font-family:var(--font-display); font-weight:600; font-size:clamp(28px,4vw,40px); }
  .sec-line{ flex:1; height:1px; background:var(--line); }
  .reveal{ opacity:0; transform:translateY(18px); transition:opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in{ opacity:1; transform:none; }
  .about-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:60px; }
  @media (max-width:760px){ .about-grid{ grid-template-columns:1fr; } }
  .about-text p{ font-size:17px; color:var(--ink); margin-bottom:18px; max-width:52ch; }
  .about-text .lede{ font-family:var(--font-display); font-size:22px; color:var(--ink); margin-bottom:22px; font-weight:500; }
  .callout-box{ border:1px dashed var(--line-strong); padding:22px 24px; font-family:var(--font-mono); font-size:12.5px; color:var(--ink-dim); position:relative; }
  .callout-box::before{ content:"NOTE"; position:absolute; top:-9px; left:16px; background:var(--bg); padding:0 8px; color:var(--amber); letter-spacing:0.1em; font-size:10px; }
  .timeline{ position:relative; padding-left:32px; }
  .timeline::before{ content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1px; background:var(--line-strong); background-image:linear-gradient(var(--line-strong) 60%, transparent 0%); background-size:1px 6px; }
  .tl-item{ position:relative; padding-bottom:44px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-item::before{ content:""; position:absolute; left:-32px; top:5px; width:9px; height:9px; border:1px solid var(--amber); background:var(--bg); transform:rotate(45deg); }
  .tl-rev{ font-family:var(--font-mono); font-size:11px; color:var(--amber); letter-spacing:0.08em; }
  .tl-title{ font-family:var(--font-display); font-size:19px; font-weight:600; margin-top:6px; }
  .tl-org{ color:var(--blue); font-size:14px; margin-top:2px; }
  .tl-date{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim); margin-top:6px; }
  .tl-desc{ margin-top:10px; font-size:14.5px; color:var(--ink-dim); max-width:56ch; }
  .subsection-title{ font-family:var(--font-mono); font-size:12px; letter-spacing:0.12em; color:var(--ink-dim); text-transform:uppercase; margin:60px 0 26px; }
  .subsection-title:first-child{ margin-top:0; }
  .legend{ border:1px solid var(--line); background:var(--panel); }
  .legend-row{ display:grid; grid-template-columns:180px 1fr; border-bottom:1px solid var(--line); }
  .legend-row:last-child{ border-bottom:none; }
  .legend-key{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.06em; color:var(--amber); padding:18px 20px; border-right:1px solid var(--line); text-transform:uppercase; }
  .legend-val{ padding:18px 20px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .chip{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink); border:1px solid var(--line-strong); padding:5px 12px; }
  @media (max-width:600px){
    .legend-row{ grid-template-columns:1fr; }
    .legend-key{ border-right:none; border-bottom:1px solid var(--line); padding-bottom:10px; }
  }
  .proj-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  @media (max-width:760px){ .proj-grid{ grid-template-columns:1fr; } }
  .proj-card{ border:1px solid var(--line); background:var(--panel); padding:28px; position:relative; transition:border-color 0.2s ease, transform 0.2s ease; }
  .proj-card:hover{ border-color:var(--blue); transform:translateY(-3px); }
  .proj-tag{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); letter-spacing:0.08em; display:flex; justify-content:space-between; margin-bottom:16px; }
  .proj-tag .status{ color:var(--amber); }
  .proj-title{ font-family:var(--font-display); font-size:21px; font-weight:600; margin-bottom:6px; }
  .proj-role{ font-family:var(--font-mono); font-size:11.5px; color:var(--blue); margin-bottom:14px; }
  .proj-desc{ font-size:14.5px; color:var(--ink-dim); }
  .proj-desc li{ margin-left:18px; margin-bottom:6px; }
  .proj-foot{ margin-top:20px; padding-top:14px; border-top:1px dashed var(--line); font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); display:flex; justify-content:space-between; }
  .notes-list{ display:flex; flex-direction:column; }
  .note-item{ display:grid; grid-template-columns:140px 1fr; gap:24px; padding:26px 0; border-bottom:1px solid var(--line); }
  .note-item:first-child{ padding-top:0; }
  @media (max-width:600px){ .note-item{ grid-template-columns:1fr; gap:6px; } }
  .note-date{ font-family:var(--font-mono); font-size:11.5px; color:var(--amber); }
  .note-title{ font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:8px; }
  .note-body{ font-size:14.5px; color:var(--ink-dim); max-width:60ch; }
  .edit-flag{ display:inline-block; margin-top:10px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim);
